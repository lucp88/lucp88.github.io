<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Gift Exchange</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(to bottom, #1a2f4a 0%, #2d4a6b 50%, #3d5a7b 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        .christmas-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }
        
        .nativity-scene {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 300px;
            background: linear-gradient(to top, #ffffff 0%, #e8f0ff 40%, transparent 100%);
            pointer-events: none;
            z-index: 1;
        }
        
        .star-of-bethlehem {
            position: absolute;
            top: 50px;
            right: 100px;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #fff9e6 0%, #ffd700 40%, transparent 70%);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: twinkle 3s ease-in-out infinite;
            z-index: 5;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.8; transform: scale(1) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
        }
        
        .snow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        
        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            font-size: 1em;
            animation: fall linear infinite;
        }
        
        @keyframes fall {
            to { transform: translateY(100vh); }
        }
        
        .christmas-title {
            font-family: 'Cinzel', serif;
            text-align: center;
            color: #ffd700;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-weight: 600;
        }
        
        .subtitle {
            font-family: 'Cinzel', serif;
            text-align: center;
            color: #fff9e6;
            font-size: 1.2em;
            margin-bottom: 40px;
            font-style: italic;
        }
        
        .gift-exchange-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 3px solid #8b4513;
            position: relative;
        }
        
        .gift-exchange-box::before {
            content: '✦';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            color: #ffd700;
        }
        
        .instructions {
            text-align: center;
            color: #2d4a6b;
            font-size: 1.1em;
            margin-bottom: 30px;
            font-family: 'Raleway', sans-serif;
        }
        
        .name-select {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .name-select label {
            font-family: 'Cinzel', serif;
            color: #8b4513;
            font-size: 1.2em;
            margin-right: 15px;
        }
        
        .name-select select {
            padding: 10px 20px;
            font-size: 1.1em;
            border: 2px solid #8b4513;
            border-radius: 5px;
            background: white;
            font-family: 'Raleway', sans-serif;
            cursor: pointer;
        }
        
        .code-input {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .code-input input {
            padding: 12px 20px;
            font-size: 1.2em;
            border: 2px solid #8b4513;
            border-radius: 5px;
            width: 200px;
            text-align: center;
            font-family: 'Raleway', sans-serif;
        }
        
        .reveal-button {
            display: block;
            margin: 0 auto;
            padding: 15px 40px;
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.2em;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 69, 19, 0.3);
        }
        
        .reveal-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 69, 19, 0.4);
            background: linear-gradient(135deg, #a0522d 0%, #8b4513 100%);
        }
        
        .result-box {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #fff9e6 0%, #ffd700 100%);
            border-radius: 10px;
            text-align: center;
            display: none;
            border: 2px solid #8b4513;
        }
        
        .result-box.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-text {
            font-family: 'Cinzel', serif;
            font-size: 1.5em;
            color: #2d4a6b;
            margin: 0;
        }
        
        .recipient-name {
            font-weight: 600;
            color: #8b4513;
            font-size: 1.3em;
        }
        
        .error-message {
            color: #d32f2f;
            text-align: center;
            margin-top: 10px;
            font-family: 'Raleway', sans-serif;
        }
        
        .three-kings {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 40px;
            opacity: 0.3;
            transform: scaleX(-1);
        }
        
        .bethlehem-text {
            position: absolute;
            bottom: 10px;
            left: 30px;
            font-family: 'Cinzel', serif;
            color: rgba(139, 69, 19, 0.3);
            font-size: 0.9em;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="star-of-bethlehem"></div>
    
    <div class="snow" id="snow"></div>
    
    <div class="nativity-scene"></div>
    
    <div class="christmas-container">
        <h1 class="christmas-title">Christmas Gift Exchange</h1>
        <p class="subtitle">"For unto us a child is born, unto us a son is given"</p>
        
        <div class="gift-exchange-box">
            <p class="instructions">
                Select your name and enter your secret code to discover<br>
                who you will be blessing with a gift this Christmas season.
            </p>
            
            <div class="name-select">
                <label for="nameSelect">Your Name:</label>
                <select id="nameSelect">
                    <option value="">Choose your name...</option>
                    <option value="Laurens">Laurens</option>
                    <option value="Bela">Bela</option>
                    <option value="Frank">Frank</option>
                    <option value="Marjo">Marjo</option>
                    <option value="Anna">Anna</option>
                    <option value="Tobias">Tobias</option>
                    <option value="Merve">Merve</option>
                    <option value="Lucas">Lucas</option>
                </select>
            </div>
            
            <div class="code-input">
                <input type="text" id="codeInput" placeholder="Enter your code" maxlength="6">
            </div>
            
            <button class="reveal-button" onclick="revealRecipient()">Reveal Your Recipient</button>
            
            <div class="error-message" id="errorMessage"></div>
            
            <div class="result-box" id="resultBox">
                <p class="result-text">
                    You will be giving a gift to:<br>
                    <span class="recipient-name" id="recipientName"></span>
                </p>
            </div>
            
            <div class="three-kings">🐪🐪🐪</div>
            <div class="bethlehem-text">Journey to Bethlehem</div>
        </div>
    </div>
    
    <script>
        // Create snowfall effect
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.innerHTML = '❄';
            snowflake.style.left = Math.random() * window.innerWidth + 'px';
            snowflake.style.animationDuration = Math.random() * 3 + 2 + 's';
            snowflake.style.opacity = Math.random();
            snowflake.style.fontSize = Math.random() * 10 + 10 + 'px';
            
            document.getElementById('snow').appendChild(snowflake);
            
            setTimeout(() => {
                snowflake.remove();
            }, 5000);
        }
        
        setInterval(createSnowflake, 200);
        
        // Secret Santa pairings with codes
        // Making sure no one is paired with each other reciprocally
        const pairings = {
            'Laurens': { code: 'STAR24', recipient: 'Frank' },
            'Bela': { code: 'KINGS3', recipient: 'Marjo' },
            'Frank': { code: 'PEACE7', recipient: 'Anna' },
            'Marjo': { code: 'JOY123', recipient: 'Tobias' },
            'Anna': { code: 'HOPE88', recipient: 'Merve' },
            'Tobias': { code: 'LOVE42', recipient: 'Lucas' },
            'Merve': { code: 'FAITH5', recipient: 'Laurens' },
            'Lucas': { code: 'LIGHT9', recipient: 'Bela' }
        };
        
        function revealRecipient() {
            const nameSelect = document.getElementById('nameSelect');
            const codeInput = document.getElementById('codeInput');
            const resultBox = document.getElementById('resultBox');
            const recipientName = document.getElementById('recipientName');
            const errorMessage = document.getElementById('errorMessage');
            
            // Clear previous messages
            errorMessage.textContent = '';
            resultBox.classList.remove('show');
            
            const selectedName = nameSelect.value;
            const enteredCode = codeInput.value.toUpperCase();
            
            if (!selectedName) {
                errorMessage.textContent = 'Please select your name first.';
                return;
            }
            
            if (!enteredCode) {
                errorMessage.textContent = 'Please enter your code.';
                return;
            }
            
            const pairing = pairings[selectedName];
            
            if (pairing && pairing.code === enteredCode) {
                recipientName.textContent = pairing.recipient;
                resultBox.classList.add('show');
                errorMessage.textContent = '';
            } else {
                errorMessage.textContent = 'Invalid code. Please check with the organizer.';
            }
        }
        
        // Allow Enter key to reveal
        document.getElementById('codeInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                revealRecipient();
            }
        });
    </script>
</body>
</html>
